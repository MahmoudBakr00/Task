<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — متابعة تنفيذ المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-floor:#f3f2f1;--bg-panel:#ffffff;--bg-elevated:#f3f2f1;--border:#e1dfdd;--border-soft:#edebe9;--text-primary:#201f1e;--text-muted:#605e5c;--accent:#0078d4;--accent-dim:#106ebe;--status-late:#d13438;--status-late-bg:rgba(209,52,56,.09);--radius-sm:6px;--radius-lg:16px;--font-display:'Tajawal','Segoe UI',sans-serif;--shadow-panel:0 1.6px 3.6px rgba(0,0,0,.08),0 0.3px 0.9px rgba(0,0,0,.06)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-floor);color:var(--text-primary);font-family:var(--font-display);direction:rtl;min-height:100vh}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow-panel)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.brand-mark{width:52px;height:52px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.brand h1{font-size:18px;margin:10px 0 4px}
.brand span{font-size:12.5px;color:var(--text-muted)}
form{display:grid;gap:14px;margin-top:8px}
.form-row{display:grid;gap:6px}
label{font-size:12.5px;color:var(--text-muted);font-weight:600}
input{font-family:var(--font-display);background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;width:100%}
input:focus{outline:none;border-color:var(--accent)}
.btn{font-family:var(--font-display);font-size:14px;font-weight:700;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:var(--status-late-bg);color:var(--status-late);border:1px solid rgba(209,52,56,.3);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;display:none}
.login-error.show{display:block}
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">⏱</div>
      <h1>متابعة تنفيذ المهام</h1>
      <span>سجّل دخولك للمتابعة</span>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="form-row">
        <label for="email">البريد الإلكتروني أو الكود الوظيفي</label>
        <input type="text" id="email" autocomplete="username" required placeholder="you@example.com أو الكود الوظيفي">
      </div>
      <div class="form-row">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="loginBtn">دخول</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  const SUPABASE_URL = 'https://tzjegripbztrqdfvretb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E2ZLXk6cHRevtZZY5LWlmA_-LSpNFYJ';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  (async () => {
    const { data } = await supabase.auth.getSession();
    if (data.session) window.location.href = 'dashboard.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'جاري الدخول...';

    const rawInput = document.getElementById('email').value.trim();
    const email = rawInput.includes('@') ? rawInput : `${rawInput}@mee-tasks.local`;
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError('البيانات غير صحيحة');
      loginBtn.disabled = false;
      loginBtn.textContent = 'دخول';
      return;
    }

    window.location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
