<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — متابعة تنفيذ المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark" style="width:52px;height:52px;font-size:22px;">⏱</div>
      <div class="brand-text">
        <h1>متابعة تنفيذ المهام</h1>
        <span>سجّل دخولك للمتابعة</span>
      </div>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="form-row">
        <label for="email">البريد الإلكتروني</label>
        <input type="text" id="email" autocomplete="username" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="justify-content:center; margin-top:6px;">
        دخول
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  (async () => {
    const { data } = await supabase.auth.getSession();
    if (data.session) window.location.href = 'dashboard.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'جاري الدخول...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
      loginBtn.disabled = false;
      loginBtn.textContent = 'دخول';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
