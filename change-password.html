<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة المرور — متابعة تنفيذ المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-floor:#f3f2f1;--bg-panel:#ffffff;--bg-elevated:#f3f2f1;--border:#e1dfdd;--border-soft:#edebe9;--text-primary:#201f1e;--text-muted:#605e5c;--accent:#0078d4;--accent-dim:#106ebe;--status-late:#d13438;--status-late-bg:rgba(209,52,56,.09);--radius-sm:6px;--radius-lg:16px;--font-display:'Tajawal','Segoe UI',sans-serif;--shadow-panel:0 1.6px 3.6px rgba(0,0,0,.08),0 0.3px 0.9px rgba(0,0,0,.06)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-floor);color:var(--text-primary);font-family:var(--font-display);direction:rtl;min-height:100vh}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:32px 28px;box-shadow:var(--shadow-panel)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.brand-mark{width:52px;height:52px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.brand h1{font-size:17px;margin:10px 0 4px}
.brand span{font-size:12.5px;color:var(--text-muted);line-height:1.6}
form{display:grid;gap:14px;margin-top:8px}
.form-row{display:grid;gap:6px}
label{font-size:12.5px;color:var(--text-muted);font-weight:600}
input{font-family:var(--font-display);background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;width:100%}
input:focus{outline:none;border-color:var(--accent)}
.btn{font-family:var(--font-display);font-size:14px;font-weight:700;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:var(--status-late-bg);color:var(--status-late);border:1px solid rgba(209,52,56,.3);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;display:none}
.login-error.show{display:block}
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">🔑</div>
      <h1>لازم تغيّر كلمة المرور</h1>
      <span>أول مرة بتدخل، اختار كلمة مرور جديدة بدل الافتراضية</span>
    </div>

    <div id="err" class="login-error"></div>

    <form id="pwForm">
      <div class="form-row">
        <label for="pw1">كلمة المرور الجديدة</label>
        <input type="password" id="pw1" required minlength="6" placeholder="6 حروف/أرقام على الأقل">
      </div>
      <div class="form-row">
        <label for="pw2">تأكيد كلمة المرور</label>
        <input type="password" id="pw2" required minlength="6" placeholder="اكتبها تاني">
      </div>
      <button type="submit" class="btn" id="btn">حفظ ودخول</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  const SUPABASE_URL = 'https://tzjegripbztrqdfvretb.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E2ZLXk6cHRevtZZY5LWlmA_-LSpNFYJ';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const errBox = document.getElementById('err');
  const btn = document.getElementById('btn');

  function showError(msg) { errBox.textContent = msg; errBox.classList.add('show'); }

  (async () => {
    const { data } = await supabase.auth.getSession();
    if (!data.session) { window.location.href = 'index.html'; return; }
  })();

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');

    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw1 !== pw2) { showError('كلمتا المرور مش متطابقتين'); return; }
    if (pw1.length < 6) { showError('كلمة المرور لازم تكون 6 حروف/أرقام على الأقل'); return; }

    btn.disabled = true; btn.textContent = 'جاري الحفظ...';

    const { data: userData } = await supabase.auth.getUser();
    const uid = userData?.user?.id;

    const { error: pwError } = await supabase.auth.updateUser({ password: pw1 });
    if (pwError) {
      showError('حصل خطأ أثناء تغيير كلمة المرور: ' + pwError.message);
      btn.disabled = false; btn.textContent = 'حفظ ودخول';
      return;
    }

    if (uid) {
      await supabase.from('profiles').update({ must_change_password: false }).eq('id', uid);
    }

    window.location.href = 'dashboard.html';
  });
})();
</script>
</body>
</html>
